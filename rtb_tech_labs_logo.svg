<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="100%" height="100%">
  <defs>
    <!-- Brand Guide Colors: Ciano Neon (#1ADEFF) e Azul Elétrico (#1250E8) -->
    <linearGradient id="rtbBrandGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1ADEFF" />
      <stop offset="40%" stop-color="#00A8FF" />
      <stop offset="75%" stop-color="#1D68FE" />
      <stop offset="100%" stop-color="#1248E5" />
    </linearGradient>

    <!-- Wave Gradient -->
    <linearGradient id="rtbWaveGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#0090FF" />
      <stop offset="50%" stop-color="#1ADEFF" />
      <stop offset="100%" stop-color="#24E5FF" />
    </linearGradient>

    <!-- Clean Glow -->
    <filter id="rtbCleanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;800&amp;display=swap');
    .logo-bold {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      fill: #FFFFFF;
    }
    .logo-light {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 300;
      fill: #FFFFFF;
    }
  </style>

  <!-- Symbol Mark (Width: exactly 380px, from X=60 to X=440) -->
  <g id="symbol-mark" filter="url(#rtbCleanGlow)">
    <!-- 1. Left Horizontal Pulse Line -->
    <path d="M 60,118 L 165,118" 
          fill="none" stroke="#1248E5" stroke-width="8" stroke-linecap="round" />

    <!-- 2. Diagonal upward sweep across the bowl -->
    <path d="M 160,118 C 185,118 215,96 250,68" 
          fill="none" stroke="url(#rtbBrandGrad)" stroke-width="8" stroke-linecap="round" />

    <!-- 3. R Stem, Base and Outer Bowl -->
    <path d="M 165,118 L 165,32 Q 165,22 176,22 L 255,22 C 295,22 312,42 312,72 C 312,102 292,122 255,122" 
          fill="none" stroke="url(#rtbBrandGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Stem base -->
    <path d="M 165,118 L 165,175 L 192,175 L 192,122" 
          fill="none" stroke="#1248E5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Inner bowl loop -->
    <path d="M 192,50 L 250,50 C 275,50 284,58 284,72 C 284,86 275,94 250,94" 
          fill="none" stroke="url(#rtbBrandGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- 4. Leg and Audio Wave (Double concentric path) -->
    <!-- Upper track -->
    <path d="M 292,102 L 326,148 C 342,170 354,172 370,158 C 385,145 400,145 415,158 C 428,170 435,168 440,166" 
          fill="none" stroke="url(#rtbWaveGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Lower track -->
    <path d="M 228,114 L 272,172 C 292,192 312,192 328,176 C 345,160 362,160 378,176 C 394,190 405,185 412,182" 
          fill="none" stroke="url(#rtbWaveGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography: Aligned exactly to X=60..440 (width = 380px) -->
  <text x="60" y="222" textLength="380" lengthAdjust="spacingAndGlyphs" font-size="34">
    <tspan class="logo-bold">RTB</tspan>
    <tspan class="logo-light"> TECH LABS</tspan>
  </text>
</svg>
