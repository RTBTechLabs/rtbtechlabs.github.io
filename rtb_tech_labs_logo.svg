<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" width="100%" height="100%">
  <defs>
    <linearGradient id="rtbWaveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="rtbGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(180, 20)">
    <!-- Glow Layer -->
    <path d="M -90,75 L -10,75 C 10,75 25,65 30,45 C 36,20 20,5 -5,5 L -60,5 L -60,115 M -15,5 L -15,55 L -45,55 M 0,55 L 35,115 C 50,115 55,95 70,95 C 85,95 95,115 115,115"
          fill="none" stroke="#00E5FF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.35" filter="url(#rtbGlow)" />
    
    <!-- Sharp Core Layer -->
    <path d="M -90,75 L -10,75 C 10,75 25,65 30,45 C 36,20 20,5 -5,5 L -60,5 L -60,115 M -15,5 L -15,55 L -45,55 M 0,55 L 35,115 C 50,115 55,95 70,95 C 85,95 95,115 115,115"
          fill="none" stroke="url(#rtbWaveGrad)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography: RTB TECH LABS -->
  <text x="260" y="185" text-anchor="middle"
        font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="34" font-weight="900" letter-spacing="4" fill="#FFFFFF">
    RTB <tspan fill="#00E5FF">TECH</tspan> LABS
  </text>
  <text x="260" y="208" text-anchor="middle"
        font-family="'JetBrains Mono', monospace"
        font-size="11" font-weight="700" letter-spacing="6" fill="#94A3B8">
    HARDWARE &amp; SOFTWARE RESEARCH
  </text>
</svg>
